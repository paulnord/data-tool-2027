name: Desktop release
on:
  workflow_dispatch:
    inputs:
      build_packages:
        description: Build installers as well as running validation
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
  package:
    needs: verify
    if: inputs.build_packages
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - run: rustup update stable
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npx tauri icon src-tauri/icons/icon.svg
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: v0.3.0
          releaseName: Data Tool 2027 0.3
          releaseBody: |
            # Data Tool 2027 0.3.0

            Version 0.3 makes graph inspection, figure export, and printed reports easier to use, and documents the program for a future implementation.

            **[Open the browser app](https://paulnord.github.io/data-tool-2027/)** · **[Download example files](https://github.com/paulnord/data-tool-2027/releases/download/v0.3.0/examples.zip)** · **[Program specification](https://github.com/paulnord/data-tool-2027/blob/v0.3.0/docs/program-specification.md)**

            All fitting and export conversion happen locally. No account, telemetry, or measurement upload is required. The browser app requires a connection to open or reload; save your work before closing it.

            ## Changes since 0.2

            - The main toolbar groups labeled Undo and Redo buttons with Display and Settings on the left. Data, Save session, Copy report, Print, and Export graph are on the right.
            - Display provides shared color palettes, marker sizes, and marker styles. Solid markers have no white halo; open circles have transparent centers. The same appearance carries through the graphs, reports, and exports.
            - Matching X-axis and Y-axis menus contain log scales, zoom, explicit limits, and Auto. The bottom range-control row is removed to give the graphs more space. Confidence-band assumptions sit beside the checkbox without shifting the plots when toggled.
            - Data and residual frames have equal widths, a narrow gap, and a shared X axis. The residual plot remains shorter than the data plot.
            - Every single-fit print-preview sheet has visible boundaries and a page number. Preview and printing use the same measured page divisions. Full-page graph mode can be switched inside the preview: both plots rotate together on the first portrait Letter sheet, with upright report content afterward. Keep the printer orientation at Portrait.
            - Export graph downloads editable SVG, high-resolution PNG, and a cropped vector PDF with an embedded Unicode font. PDF is suitable for direct LaTeX/Overleaf inclusion. Collision and multi-interval exports use the active visible graphs.
            - Copy-report settings select statistics, parameter correlations, observations/residuals, and source notes. Compact and technical presets are available. Printed reports include the parameter correlation matrix.
            - Published damped-oscillator sessions from PR #4 are included, with their source data and documentation. Data loading also exposes the available built-in and published examples.
            - A new program specification records workflows, scientific and compatibility contracts, acceptance criteria, current limitations, and proposed improvements for a future rebuild. Localization is proposed; translations are not yet included.

            ## Desktop downloads

            | Platform | Installer |
            | --- | --- |
            | Mac, Intel or Apple Silicon | [Universal DMG](https://github.com/paulnord/data-tool-2027/releases/download/v0.3.0/Data.Tool.2027_0.3.0_universal.dmg) |
            | Windows, 64-bit Intel or AMD | [Windows setup](https://github.com/paulnord/data-tool-2027/releases/download/v0.3.0/Data.Tool.2027_0.3.0_x64-setup.exe) |
            | Linux, 64-bit Intel or AMD | [DEB](https://github.com/paulnord/data-tool-2027/releases/download/v0.3.0/Data.Tool.2027_0.3.0_amd64.deb) or [AppImage](https://github.com/paulnord/data-tool-2027/releases/download/v0.3.0/Data.Tool.2027_0.3.0_amd64.AppImage) |

            The Mac app targets macOS 12.3 or newer and is ad-hoc signed, not Apple-notarized. The Windows installer is unsigned and uses WebView2. Linux packages are built on Ubuntu 22.04 and require compatible desktop libraries; AppImage may require FUSE. Windows ARM and Linux ARM installers are not included. GitHub source archives are for developers.

            ## Scientific and compatibility scope

            Requests and acknowledgments remain v1; `.trksess` session v1, v2, and v3 remain readable. Appearance and axis preferences do not alter the observations, uncertainty assumptions, or fit. Parameter correlations derive from the fitted covariance; no covariance between independently fitted intervals is estimated.

            Single-fit sessions and source CSVs can be saved. Collision and multi-interval configurations remain in-memory drafts: copy or print those reports before closing. X-error regression, general correlated-error fitting, and complete systematic uncertainty budgets are outside the implemented model. Nonlinear convergence and locally approximated uncertainty require review. Confidence bands describe the pointwise fitted mean, not prediction intervals.

            ## Validation

            Release gates cover numerical regression and coverage tests, end-to-end browser workflows, the production web build under its hosted URL prefix, and native host tests. Print validation checks actual frame alignment, rotated portrait pages, table boundaries, and preservation of long source notes. Download tests inspect SVG/PNG/PDF content, scientific labels, marker coordinates, and active-analysis selection.

            The desktop workflow runs host tests and packages on macOS, Windows, and Linux. Automated checks and rendered-output inspection do not establish interactive compatibility with every operating system, printer, or institution's installation policy.

            [Numerical methods](https://github.com/paulnord/data-tool-2027/blob/v0.3.0/docs/numerical-methods.md) · [Tracker integration](https://github.com/paulnord/data-tool-2027/blob/v0.3.0/docs/integration.md) · [Published datasets](https://github.com/paulnord/data-tool-2027/blob/v0.3.0/examples/data/published/README.md) · [License](https://github.com/paulnord/data-tool-2027/blob/v0.3.0/LICENSE)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
