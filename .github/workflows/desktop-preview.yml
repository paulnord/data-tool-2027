name: Desktop preview
on:
  workflow_dispatch:
    inputs:
      build_packages:
        description: Build installers as well as running validation
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
  package:
    if: inputs.build_packages
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - run: rustup update stable
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npx tauri icon src-tauri/icons/icon.svg
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: v0.1.0-preview.1
          releaseName: Data Tool 2027 — first desktop preview
          releaseBody: |
            Data Tool 2027 fits and graphs data for physics labs. **Choose how you want to use it below.**
            
            **[Open in your browser — Chromebook and other computers](https://paulnord.github.io/data-tool-2027/)**
            
            No installation or account needed. Your measurements stay in your browser. Internet is needed to open or reload the app; save your session before closing the tab. **[Download example files](https://paulnord.github.io/data-tool-2027/examples.zip)**, extract them, then open them through Data → Load file. [Browser instructions](https://github.com/paulnord/data-tool-2027/blob/main/docs/chromebook.md).
            
            **Prefer a desktop app? Choose one installer:**
            
            | Your computer | Download | How to use it |
            |---|---|---|
            | **Windows** — 64-bit Intel or AMD PC | **[Download for Windows](https://github.com/paulnord/data-tool-2027/releases/download/v0.1.0-preview.1/Data.Tool.2027_0.1.0_x64-setup.exe)** · 2.2 MB | Open the downloaded setup file and follow the installer. |
            | **Mac** — Intel or Apple Silicon (M-series) | **[Download for Mac](https://github.com/paulnord/data-tool-2027/releases/download/v0.1.0-preview.1/Data.Tool.2027_0.1.0_universal.dmg)** · 6.3 MB | Open the disk image and drag Data Tool 2027 into Applications. The same download includes both Mac processor types; it targets macOS 12.3 or newer. |
            | **Linux** — 64-bit Intel or AMD, Debian/Ubuntu family | **[Download Linux installer (.deb)](https://github.com/paulnord/data-tool-2027/releases/download/v0.1.0-preview.1/Data.Tool.2027_0.1.0_amd64.deb)** · 3.3 MB | Install with your distribution’s package manager. Built on Ubuntu 22.04. |
            | **Linux** — 64-bit Intel or AMD, AppImage option | **[Download Linux AppImage](https://github.com/paulnord/data-tool-2027/releases/download/v0.1.0-preview.1/Data.Tool.2027_0.1.0_amd64.AppImage)** · 80.8 MB | Mark the file as executable, then run it. Requires a compatible Linux desktop and FUSE support. |
            
            The Linux downloads are alternatives; you do not need both. Windows ARM and Linux ARM builds are not included. GitHub’s **Source code** downloads below are for developers, not installers.
            
            **This is a development preview.** The Windows installer is unsigned and the Mac app is not Apple-notarized, so your operating system may show a security warning or block opening it. Native file dialogs, file associations and printing still need testing on each target platform; build targets are not guarantees of compatibility with every OS version.
            
            **Getting started:** open **Data → Load file** to find the bundled example files, or load your own CSV data. Fitting runs locally; no student data is uploaded.
            
            **Saving your work:** single-fit sessions and CSV data can be saved. Multi-interval and collision setups are still in-memory drafts—copy or print their reports before closing.
            
            <details>
            <summary>Build and test details</summary>
            
            154 scientific tests, 70 browser workflows and the web build passed. Five native host tests passed on Windows, Mac and Linux. The Mac disk image checksum, ad-hoc signature, both processor architectures and bundled examples were checked locally.
            
            Installer source: [4eaf7a9](https://github.com/paulnord/data-tool-2027/tree/4eaf7a9be9f86ff87050510ef532687fd2d6aff6). Source, license and Tracker integration documentation are in the repository.
            
            </details>
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
