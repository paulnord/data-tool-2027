[package]
name = "data-tool-2027"
version = "0.1.0"
edition = "2021"
description = "Local-data fitting and graphing for undergraduate physics laboratories"
license-file = "../LICENSE"
repository = "https://github.com/paulnord/data-tool-2027"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
